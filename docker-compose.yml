services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5299:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=auraconnect_test;Username=local_dev;Password=KQP2Hqg16gqp5u
      - Serilog__WriteTo__1__Args__serverUrl=http://seq
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auraconnect_test
      POSTGRES_USER: local_dev
      POSTGRES_PASSWORD: KQP2Hqg16gqp5u
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_dev -d auraconnect_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  seq_data:
