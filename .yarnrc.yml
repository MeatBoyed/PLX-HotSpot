nodeLinker: node-modules

# Each workspace resolves its own declared external deps (no cross-app hoist to
# root). Legacy stays dependency-isolated; current apps keep independent versions
# until the shared-packages slice aligns them. Internal @auraconnect/* packages
# still symlink across workspaces, so internal sharing is unaffected.
nmHoistingLimits: workspaces

# --- supply-chain hardening (see .claude/skills/supply-chain-guard) ---
# No package may run install/build scripts unless explicitly allowlisted via
# dependenciesMeta.<pkg>.built in the root package.json.
enableScripts: false
# Abort the install if a resolved package's checksum drifts from yarn.lock.
checksumBehavior: throw
# New `yarn add` pins exact versions (no ^/~) — ADR 0001 intent under Berry.
defaultSemverRangePrefix: ""
