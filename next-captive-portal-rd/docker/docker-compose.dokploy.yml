# --- Dokploy variant ---
# Shared env vars are sourced from the .env file created by Dokploy (UI → Environment tab).
# Site-specific env vars are sourced from ./env/<portal>.env (tracked in repo).
#
# Add all vars from docker/env/.env.shared.example to the Dokploy Environment tab.
# Dokploy writes them to a .env file in this directory at deploy time.

# --- Shared portal defaults (merged via YAML anchor) ---
x-portal-base: &portal-base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
  restart: unless-stopped

# --- Portal services ---
services:      
  mabopane:
    <<: *portal-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SHARED_BUILD_ENV_FILE: docker/.env
        BUILD_ENV_FILE: docker/env/mabopane.env
    image: auraconnect-mabopane:latest
    ports:
      - "4001:3000"
    env_file:
      - .env
      - ./env/mabopane.env
  
  deneboom:
    <<: *portal-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SHARED_BUILD_ENV_FILE: docker/.env
        BUILD_ENV_FILE: docker/env/deneboom.env
    image: auraconnect-deneboom:latest
    ports:
      - "4002:3000"
    env_file:
      - .env
      - ./env/deneboom.env

  dev:
    <<: *portal-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SHARED_BUILD_ENV_FILE: docker/.env
        BUILD_ENV_FILE: docker/env/dev.env
    image: auraconnect-dev:latest
    ports:
      - "4003:3000"
    env_file:
      - .env
      - ./env/dev.env
